name: 'Sendgrid Sync'
description: 'Syncronize Sendgrid Templates'
inputs:
  dry-run:
    required: false
    description: "Only show affected files"
    default: "false"
  mode:
    required: true
    description: "The mode to run the action. Could be `sync` or `apply`"
  committer-email:
    required: false
    description: "The email to use when creating the commits"
  committer-name:
    required: false
    description: "The name to use when creating the commits"
  template-name:
    required: false
    description: "Specific template directory name to apply (skips git diff detection)"
    default: ""
  draft-pr:
    required: false
    description: "Create template pull requests as draft"
    default: "true"
runs:
  using: 'docker'
  image: 'Dockerfile'
  args:
    - --dry-run
    - ${{ inputs.dry-run }}
    - --mode
    - ${{ inputs.mode }}
    - --committer-email
    - ${{ inputs.committer-email }}
    - --committer-name
    - ${{ inputs.committer-name }}
    - --template-name
    - ${{ inputs.template-name }}
    - --draft-pr
    - ${{ inputs.draft-pr }}
